<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Dossiê">
  <title>Dossiê</title>
  <!-- Rastros dispersos convergindo para um núcleo. -->
  <g stroke="#2b5cff" stroke-width="2.6" stroke-linecap="round">
    <line x1="23" y1="16" x2="29" y2="16" transform="rotate(0 16 16)" opacity=".95"/>
    <line x1="23" y1="16" x2="27.5" y2="16" transform="rotate(45 16 16)" opacity=".55"/>
    <line x1="23" y1="16" x2="28.5" y2="16" transform="rotate(90 16 16)" opacity=".8"/>
    <line x1="23" y1="16" x2="26.5" y2="16" transform="rotate(135 16 16)" opacity=".4"/>
    <line x1="23" y1="16" x2="29" y2="16" transform="rotate(180 16 16)" opacity=".9"/>
    <line x1="23" y1="16" x2="27" y2="16" transform="rotate(225 16 16)" opacity=".5"/>
    <line x1="23" y1="16" x2="28" y2="16" transform="rotate(270 16 16)" opacity=".7"/>
    <line x1="23" y1="16" x2="26.5" y2="16" transform="rotate(315 16 16)" opacity=".45"/>
  </g>
  <circle cx="16" cy="16" r="8.6" fill="none" stroke="#121317" stroke-width="1.6" opacity=".22"/>
  <circle cx="16" cy="16" r="3.6" fill="#121317"/>
</svg>
